# ==========================================
# 开发环境配置
# 适用于本地开发调试
# ==========================================

spring:
  config:
    activate:
      on-profile: dev

  # 开发环境数据库配置（使用本地或 Docker 数据库）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ticket_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 600000
      connection-timeout: 30000
      max-lifetime: 1800000

  # 开发环境 Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1000ms

  # 开发环境邮件配置（使用测试邮箱或控制台输出）
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# 开发环境服务器配置
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 50
      min-spare: 5

# 开发环境日志配置（详细日志，便于调试）
logging:
  level:
    root: INFO
    com.ticket: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.mybatis: DEBUG
    com.baomidou.mybatisplus: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/ticket-system-dev.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB

# MyBatis-Plus 开发环境配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ticket.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 控制台输出 SQL
    cache-enabled: false
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT 配置（开发环境使用简单密钥）
jwt:
  secret: ${JWT_SECRET:dev-secret-key-do-not-use-in-production}
  expiration: 86400000  # 24小时，方便开发调试
  refresh-expiration: 604800000  # 7天

# 文件上传配置
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  max-size: 20971520   # 20MB
  allowed-extensions: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,zip,rar,txt,log

# SLA 配置（开发环境降低检查频率）
sla:
  check-cron: "0 */10 * * * ?"  # 每10分钟检查SLA
  auto-close-cron: "0 0 * * * ?"  # 每小时检查自动关闭
  draft-cleanup-cron: "0 0 3 * * ?"  # 每天凌晨3点清理草稿

# 钉钉配置（开发环境默认关闭）
dingtalk:
  enabled: ${DINGTALK_ENABLED:false}
  webhook: ${DINGTALK_WEBHOOK:}
  secret: ${DINGTALK_SECRET:}

# 缓存配置（开发环境使用本地缓存）
cache:
  spec: maximumSize=100,expireAfterWrite=5m
  user-cache-spec: maximumSize=50,expireAfterWrite=5m
  role-cache-spec: maximumSize=20,expireAfterWrite=10m
  module-cache-spec: maximumSize=20,expireAfterWrite=10m

# 开发环境特定配置
app:
  cors:
    allowed-origins: "*"  # 开发环境允许所有跨域
  swagger:
    enabled: true  # 启用 Swagger 文档
  h2:
    console:
      enabled: false
