spring:
  application:
    name: ticket-system
  profiles:
    active: @spring.profiles.active@
  # 开发环境默认dev
  config:
    import: optional:file:./config/application.yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/ticket_system?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1800000

  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 100MB

  mail:
    host: ${MAIL_HOST:smtp.example.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  tomcat:
    uri-encoding: UTF-8
    threads:
      max: 200
      min-spare: 10

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.ticket.modules.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    cache-enabled: true
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT配置
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production}
  expiration: 28800000  # 8小时，单位毫秒
  refresh-expiration: 604800000  # 7天，单位毫秒

# 文件配置
file:
  upload-dir: ${FILE_UPLOAD_DIR:/data/files}
  max-size: 20971520   # 20MB
  allowed-extensions: jpg,jpeg,png,gif,pdf,doc,docx,xls,xlsx,zip,rar,txt,log

# SLA配置
sla:
  check-cron: "0 */5 * * * ?"  # 每5分钟检查SLA
  auto-close-cron: "0 0 * * * ?"  # 每小时检查自动关闭
  draft-cleanup-cron: "0 0 3 * * ?"  # 每天凌晨3点清理草稿

# 钉钉配置
dingtalk:
  enabled: ${DINGTALK_ENABLED:false}
  webhook: ${DINGTALK_WEBHOOK:}
  secret: ${DINGTALK_SECRET:}

# 缓存配置
cache:
  spec: maximumSize=1000,expireAfterWrite=10m
  user-cache-spec: maximumSize=500,expireAfterWrite=10m
  role-cache-spec: maximumSize=100,expireAfterWrite=30m
  module-cache-spec: maximumSize=100,expireAfterWrite=1h

# 系统配置
system:
  init-admin-username: ${INIT_ADMIN_USERNAME:admin}
  init-admin-password: ${INIT_ADMIN_PASSWORD:Admin@123456}
  login-max-attempts: 5
  login-lock-minutes: 30
  message-edit-minutes: 5  # 消息可编辑时间（分钟）
  pending-verify-days: 3  # 待验证自动解决天数
  solved-close-days: 7  # 已解决自动关闭天数

# 操作日志配置
operation-log:
  enabled: true
  retention-days: 365  # 日志保留天数

# SpringDoc配置
springdoc:
  api-docs:
    path: /swagger-ui.html
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# Actuator配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# 日志配置
logging:
  level:
    root: info
    com.ticket: debug
    com.ticket.task: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_PATH:/var/log/ticket-system}/application.log
    max-size: 100MB
    max-history: 30
